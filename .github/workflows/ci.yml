name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.15"

      - name: Set up Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test data generator
        run: uv run --locked python -m unittest discover -s coffee-data-generator/tests -v

      - name: Install dbt v2
        run: |
          uv tool install --python 3.13 dbt==2.0.9
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Configure the dbt profile
        run: cp coffee_shop/profiles.example.yml coffee_shop/profiles.yml

      - name: Load the deliveries and run dbt build (CI)
        run: uv run --locked python warehouse/build_duckdb.py --target ci
